name: build

on:
  push:
  pull_request:

jobs:
  prototype-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate repository structure
        run: |
          test -f README.md
          test -f examples/battery.klx
          test -f examples/effects.klx
          python scripts/verify-readme.py
