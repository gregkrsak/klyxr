name: tests

on:
  push:
  pull_request:

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run prototype repository tests
        run: |
          python scripts/verify-readme.py
          grep -q "verified fn consume" examples/battery.klx
          grep -q "deny_effects" examples/effects.klx
