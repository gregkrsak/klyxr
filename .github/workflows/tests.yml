name: tests

on:
  push:
  pull_request:

jobs:
  compiler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run compiler unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee "$RUNNER_TEMP/ked031-debug.log"
          python scripts/verify-ked031-tests.py "$RUNNER_TEMP/ked031-debug.log"

      - name: Verify arithmetic checks in optimized builds
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --release 2>&1 | tee "$RUNNER_TEMP/ked031-release.log"
          python scripts/verify-ked031-tests.py "$RUNNER_TEMP/ked031-release.log"

      - name: Verify compact and explicit examples remain present
        run: |
          grep -q "verified fn consume" examples/battery_fail.klx
          grep -q "verified function consume" examples/battery_ok.klx
