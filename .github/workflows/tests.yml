name: tests

on:
  push:
  pull_request:

jobs:
  compiler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run compiler unit tests
        shell: bash
        run: |
          set -o pipefail
          B34_EVIDENCE_DIR="$RUNNER_TEMP/ked034-debug-evidence" cargo test --locked --workspace 2>&1 | tee "$RUNNER_TEMP/ked034-debug.log"
          python scripts/verify-ked035-tests.py "$RUNNER_TEMP/ked034-debug.log"
          python scripts/verify-ked034-budgets.py "$RUNNER_TEMP/ked034-debug-evidence"

      - name: Verify arithmetic checks in optimized builds
        shell: bash
        run: |
          set -o pipefail
          B34_EVIDENCE_DIR="$RUNNER_TEMP/ked034-release-evidence" cargo test --locked --workspace --release 2>&1 | tee "$RUNNER_TEMP/ked034-release.log"
          python scripts/verify-ked035-tests.py "$RUNNER_TEMP/ked034-release.log"
          python scripts/verify-ked034-budgets.py "$RUNNER_TEMP/ked034-release-evidence"

      - name: Verify compact and explicit examples remain present
        run: |
          grep -q "verified fn consume" examples/battery_fail.klx
          grep -q "verified function consume" examples/battery_ok.klx
