name: verify

on:
  push:
  pull_request:

jobs:
  battery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Accept provable battery call
        run: cargo run --quiet --bin klyxr -- verify examples/battery_ok.klx

      - name: Reject unprovable battery call with Klyxr diagnostic
        shell: bash
        run: |
          set +e
          output="$(cargo run --quiet --bin klyxr -- verify examples/battery_fail.klx 2>&1)"
          status=$?
          set -e

          echo "$output"

          test "$status" -eq 1
          grep -Fq "error: precondition cannot be established" <<<"$output"
          grep -Fq "amount == 90" <<<"$output"
          grep -Fq "battery.charge == 80" <<<"$output"
          grep -Fq "90 <= 80 is false" <<<"$output"

      - name: Keep effects example visible
        run: grep -q "heap, blocking" examples/effects.klx
