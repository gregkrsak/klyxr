<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300">
<rect width="1040" height="300" rx="26" fill="#0A0E14"/>
<text x="52" y="54" fill="#E5ECF7" font-family="Arial, sans-serif" font-size="22" font-weight="800">KLYXR MAKES THE BOUNDARIES VISIBLE</text>
<g font-family="Arial, sans-serif">
